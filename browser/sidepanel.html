<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verity</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="brand">
      <div class="logo">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <path d="M5 12.5 9.2 17 19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <div>
          <p class="word">Verity</p>
          <p id="host" class="host">Open a website</p>
        </div>
      </div>
      <button id="fresh" class="ghost" type="button">New</button>
      <div id="scan" class="scan" hidden><span></span></div>
    </header>

    <p id="bridge" class="bridge">Checking this page directly</p>
    <nav id="nav" class="nav" aria-label="Checks"></nav>
    <p id="meaning" class="meaning"></p>

    <main id="transcript"></main>

    <form id="composer" class="composer">
      <p id="notice" class="notice" hidden></p>
      <label class="ask">
        <span id="hint" class="hint"></span>
        <textarea id="draft" rows="2" placeholder="Anything specific to look at?"></textarea>
      </label>
      <button id="send" class="check" type="submit">Check this page</button>
    </form>
    <script src="dist/sidepanel.js"></script>
  </body>
</html>
