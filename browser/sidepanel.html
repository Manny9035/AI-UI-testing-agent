<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NextOps</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="brand">
      <div class="logo">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <path d="M5 12.5 9.2 17 19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <div>
          <p class="word">NextOps</p>
          <p id="host" class="host">Open a website</p>
        </div>
      </div>
      <button id="fresh" class="ghost" type="button">New</button>
    </header>

    <main id="transcript"></main>

    <form id="composer" class="composer">
      <p id="notice" class="notice" hidden></p>
      <div class="box">
        <div class="tools">
          <button id="plus" class="plus" type="button" aria-expanded="false" aria-haspopup="menu" aria-label="Choose a check">+</button>
          <div id="menu" class="menu" role="menu" hidden></div>
          <button id="chip" class="chip" type="button"></button>
        </div>
        <label class="ask">
          <textarea id="draft" rows="2" placeholder="Anything specific to look at?"></textarea>
          <span id="spinner" class="spinner" hidden></span>
        </label>
        <button id="send" class="check" type="submit">Check this page</button>
      </div>
    </form>
    <script src="dist/sidepanel.js"></script>
  </body>
</html>
